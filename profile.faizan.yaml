narrative: >
  I build AI systems end to end for a language that had none. Kashmiri had no
  neural translation model, no OCR dataset and no diacritiser, so I sourced and
  verified the data myself, trained the models, and designed the evaluation
  before trusting any result - three arXiv preprints, one as first author, and a
  translation model that beats Meta's NLLB-200-distilled-600M on COMET in both
  directions on a fraction of its data. When a model underperforms I look for the
  real cause: on the OCR program that meant identifying decoder sequence collapse
  rather than blaming encoder capacity, and redirecting eleven iterations of work
  accordingly. I also ship production software - a live real-time platform with
  real users, and an LLM orchestration tool that routes and evaluates across
  providers. B.Tech CS student, graduating 2027, looking for teams building
  serious AI systems for Indian languages and hard applied problems.

