projects:
  - id: koshur_ai
    name: "KoshurAI - neural machine translation for Kashmiri"
    role: Creator and sole engineer
    period: "2025 - present"
    summary: >
      The first specialised neural MT system for Kashmiri↔English, built from raw
      data upward for a language with no prior neural MT solution.
    highlights:
      - "Two-stage fine-tune of Gemma 3 4B: LoRA rank 16 on monolingual and back-translated data to learn Nastaliq orthography, then QLoRA rank 32 on a 4-bit NF4 base for the translation task"
      - "0.6982 COMET KS→EN and 0.6604 EN→KS on FLORES-200, against NLLB-200-distilled-600M's 0.6741 and 0.6431, on a fraction of its training data"
      - "Built the full ETL pipeline myself - InPage document extraction, normalisation, alignment validation, deduplication, human verification - producing 150K+ verified parallel pairs and a 2M+ token monolingual corpus"
      - "Stage-ordering ablations showed monolingual pre-training before the parallel fine-tune improved COMET by 0.03 over the reverse order"
    skills: [python, pytorch, huggingface, llm_finetuning, mt, nlp, low_resource_nlp, evaluation, data_engineering, deep_learning]
    domains: [indian_language_ai, low_resource_nlp, foundation_models]
    metrics:
      - "COMET 0.6982 (KS→EN) / 0.6604 (EN→KS) vs NLLB-200-distilled-600M 0.6741 / 0.6431"
      - "150K+ human-verified parallel pairs · 2M+ token monolingual corpus"
    links:
      - https://github.com/Faizaniqbal52/KoshurAI
      - https://huggingface.co/Faizaniqbal

  - id: koshur_ocr
    name: "KoshurOCR - multi-generation OCR program for Kashmiri Nastaliq"
    role: Creator and sole engineer
    period: "2025 - present"
    summary: >
      Five OCR architectures compared across ~11 experimental iterations on a
      673K-sample image-text dataset, with the failure analysis that redirected
      the whole program.
    highlights:
      - "Trained and benchmarked five architectures for Nastaliq OCR: CNN, CRNN+CTC, PARSeq, TrOCR and an Arabic-handwritten TrOCR variant"
      - "Built deterministic preprocessing and dataset engineering producing 571K+ synthetic image-text pairs, training on 670K+ samples with Unicode normalisation, curriculum learning and aspect-ratio-preserving preprocessing"
      - "Custom evaluation tooling on CER, WER, prediction coverage and decoder-length analysis showed the ceiling was decoder sequence collapse, not encoder capacity"
      - "Redirected the program toward length-aware decoding objectives instead of continuing trial-and-error iteration"
    skills: [python, pytorch, ocr, cv, deep_learning, data_engineering, evaluation, multimodal, opencv]
    domains: [document_ai, indian_language_ai, computer_vision, low_resource_nlp]
    metrics:
      - "673K-sample dataset · 5 architectures · ~11 iterations"
    links:
      - https://github.com/Faizaniqbal52/KoshurOCR

  - id: koshur_diacritizer
    name: "Koshur Diacritizer - byte-level diacritic restoration"
    role: Co-author and engineer
    period: "2026"
    summary: >
      Kashmiri text omits diacritics, creating word-level ambiguity. Framed as
      seq2seq and built on a byte-level model specifically to avoid the
      out-of-vocabulary failures sub-word tokenizers hit on diacritics.
    highlights:
      - "ByT5-small byte-level seq2seq model reaching DERm 0.0212 and WER 0.2159"
      - "77.5% accuracy under native-speaker expert evaluation - human-in-the-loop, not just automatic metrics"
      - "Released the first public dataset of 23.7K aligned diacritised Kashmiri sentence pairs"
    skills: [python, pytorch, huggingface, nlp, mt, low_resource_nlp, evaluation, deep_learning]
    domains: [indian_language_ai, low_resource_nlp]
    metrics: ["DERm 0.0212 · WER 0.2159 · 77.5% native-speaker accuracy"]
    links:
      - https://huggingface.co/Faizaniqbal

  - id: promptforge
    name: "PromptForge - multi-model LLM orchestration"
    role: Creator
    period: "Mar 2026"
