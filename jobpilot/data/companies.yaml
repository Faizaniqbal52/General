# ---------------------------------------------------------------------------
# Seed company universe: Indian AI/ML organisations worth watching, weighted
# towards Indian-language AI, document AI, speech, foundation models and
# applied AI - i.e. the places where an evidence-backed low-resource NLP / OCR
# profile actually lands.
#
# THIS IS A SEED LIST, NOT A VERIFIED DATABASE.
#   * `website` values are best-effort and should be confirmed before outreach.
#   * `ats` is intentionally left empty for most entries. Run
#         python -m jobpilot probe --write my_companies.yaml
#     to discover which board a company actually publishes on, and store the
#     verified provider/slug in your own file.
#   * `founders` and `signals` are context for outreach, not a claim of fact -
#     confirm on the company's own site before you write to anyone.
#
# `signals` vocabulary: iit_founder, iisc_founder, iim_founder, govt_backed,
# research_lab, deeptech, open_source, well_funded, early_stage.
#
# `outreach_modes` (first one wins when there is no posting):
#   direct | recruiter | founder | technical
# ---------------------------------------------------------------------------

