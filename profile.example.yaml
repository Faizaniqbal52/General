projects:
  - id: koshur_ocr
    name: KoshurOCR
    role: Solo builder
    period: "2024 - present"
    summary: >
      End-to-end OCR system for the Kashmiri (Perso-Arabic) script, covering
      synthetic and real data generation, line segmentation, recognition model
      training and evaluation.
    highlights:
      - Built a synthetic + scanned corpus for a script with no public OCR dataset
      - Trained and compared CRNN, TrOCR and PARSeq style recognisers in PyTorch
      - Set up an evaluation harness reporting CER/WER per font and per document type
    skills: [python, pytorch, ocr, cv, deep_learning, data_engineering, evaluation]
    domains: [document_ai, indian_language_ai, low_resource_nlp, computer_vision]
    metrics:
      - "<add your CER/WER numbers here>"
    links: []

  - id: koshur_ai
    name: KoshurAI
    role: Solo builder
    period: "2024 - present"
    summary: >
      Language technology work for Kashmiri: corpus collection, translation and
      evaluation of open LLMs on a language they are effectively unseen on.
    highlights:
      - Assembled and cleaned a Kashmiri text corpus from public sources
      - Fine-tuned open models with LoRA/PEFT on Hugging Face for translation
      - Ran systematic evaluations of open LLMs on low-resource language tasks
    skills: [python, nlp, llm, llm_finetuning, huggingface, low_resource_nlp, evaluation, data_engineering]
    domains: [indian_language_ai, low_resource_nlp, foundation_models]
    metrics: []
    links: []

  - id: rag_assistant
    name: Retrieval-augmented document assistant
    role: Solo builder
    period: "2025"
    summary: >
      A RAG service over scanned and digital documents with a FastAPI backend,
      chunking/embedding pipeline and answer-grounding checks.
    highlights:
      - Built ingestion, chunking, embedding and retrieval as separate services
      - Added grounding checks that reject answers with no supporting passage
    skills: [python, rag, llm, backend, evaluation, docker]
    domains: [document_ai, search, agentic_ai]
    metrics: []
    links: []

